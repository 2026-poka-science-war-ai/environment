[project]
name = "environment"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pynvvideocodec>=2",
    "wii-arena-core",
    "wii-arena-dlpack",
    "wii-arena-dolphin-docker",
]

[dependency-groups]
nvidia-docker = ["wii-arena-dolphin-docker-nvidia"]
nvidia-local = ["wii-arena-dolphin-local", "wii-arena-cuda-driver"]

[tool.uv.sources]
wii-arena-core = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-core", rev = "0581e850b8025ab2c264a90a7a41320f79348677" }
wii-arena-dlpack = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dlpack", rev = "0581e850b8025ab2c264a90a7a41320f79348677" }
wii-arena-dolphin-docker = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dolphin-docker", rev = "0581e850b8025ab2c264a90a7a41320f79348677" }
wii-arena-dolphin-docker-nvidia = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dolphin-docker-nvidia", rev = "0581e850b8025ab2c264a90a7a41320f79348677" }
wii-arena-dolphin-local = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dolphin-local", rev = "0581e850b8025ab2c264a90a7a41320f79348677" }
wii-arena-cuda-driver = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-cuda-driver", rev = "0581e850b8025ab2c264a90a7a41320f79348677" }
