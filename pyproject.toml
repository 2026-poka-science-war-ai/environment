[project]
name = "environment"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pynvvideocodec>=2",
    "wii-arena-core",
    "wii-arena-dlpack",
    "wii-arena-dolphin-docker",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
nvidia-docker = ["wii-arena-dolphin-docker-nvidia"]
nvidia-local = ["wii-arena-dolphin-local", "wii-arena-cuda-driver"]

[tool.uv.sources]
wii-arena-core = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-core", rev = "68c29727d223ddf21064b37a2aa6e40de252bddd" }
wii-arena-dlpack = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dlpack", rev = "68c29727d223ddf21064b37a2aa6e40de252bddd" }
wii-arena-dolphin-docker = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dolphin-docker", rev = "68c29727d223ddf21064b37a2aa6e40de252bddd" }
wii-arena-dolphin-docker-nvidia = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dolphin-docker-nvidia", rev = "68c29727d223ddf21064b37a2aa6e40de252bddd" }
wii-arena-dolphin-local = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-dolphin-local", rev = "68c29727d223ddf21064b37a2aa6e40de252bddd" }
wii-arena-cuda-driver = { git = "https://github.com/betarixm/wii-arena", subdirectory = "packages/wii-arena-cuda-driver", rev = "68c29727d223ddf21064b37a2aa6e40de252bddd" }

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
useLibraryCodeForTypes = true
typeCheckingMode = "strict"
include = ["environment", "tests", "main.py"]
