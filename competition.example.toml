# Copy this to competition.toml and fill in the teams, models, and picks.
#
# Each team submits two models and picks two racers per cup, both in order.
# Which two seats a team drives is drawn afresh for every cup, and the team's
# models and picks take those seats in the order they are listed.

wii_iso_file = "MarioKartWii.iso"

[teams.a]
name = "KAIST"
models = ["models/example-model.py", "models/example-model.py"]

[teams.b]
name = "POSTECH"
models = ["models/example-model.py", "models/example-model.py"]

# --- Mushroom Cup ----------------------------------------
[cups.mushroom_cup.team_a_first]
a = [
  { character = "Mario", vehicle = "Standard Kart M", drift_mode = "manual" },
  { character = "Luigi", vehicle = "Mach Bike", drift_mode = "automatic" },
]
b = [
  { character = "Peach", vehicle = "Wild Wing", drift_mode = "manual" },
  { character = "Daisy", vehicle = "Nitrocycle", drift_mode = "automatic" },
]

[cups.mushroom_cup.team_b_first]
a = [
  { character = "Yoshi", vehicle = "Bon Bon", drift_mode = "manual" },
  { character = "Birdo", vehicle = "Turbo Blooper", drift_mode = "automatic" },
]
b = [
  { character = "Toad", vehicle = "Standard Kart S", drift_mode = "manual" },
  { character = "Toadette", vehicle = "Magikruiser", drift_mode = "automatic" },
]

